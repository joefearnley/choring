<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Choring</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a> |
        {% if user.is_authenticated %}
          <span>Hi, {{ user.username }}</span> |
          <a href="{% url 'accounts:logout' %}">Logout</a>
        {% else %}
          <a href="{% url 'accounts:login' %}">Login</a> |
          <a href="{% url 'accounts:register' %}">Register</a>
        {% endif %}
      </nav>
    </header>
    <main>
      {% if messages %}
        <ul class="messages">
          {% for m in messages %}
            <li>{{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
